name: Render StoryForge Video
run-name: "Render StoryForge Video [${{ github.event.inputs.job_id }}]"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "StoryForge Job ID"
        required: true
        type: string
      test_background:
        description: "Use procedural test background (ONLY when backgrounds release is empty for smoke testing)"
        required: false
        default: "false"
        type: string

concurrency:
  group: storyforge-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Ensure FFmpeg
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          ffmpeg -version | head -n 2
          ffmpeg -filters 2>/dev/null | grep -E " ass | overlay "

      - name: Install Python dependencies & Chromium
        timeout-minutes: 8
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          playwright install chromium

      - name: Run render pipeline
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          TEST_BACKGROUND: ${{ github.event.inputs.test_background }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline/run_job.py

      - name: Preserve render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.event.inputs.job_id }}
          path: |
            /tmp/sf_render/**/*.mp4
            /tmp/sf_render/**/*.ass
            /tmp/sf_render/**/cards/*.png
          if-no-files-found: ignore
          retention-days: 3
