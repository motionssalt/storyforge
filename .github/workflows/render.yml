name: Render StoryForge Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "StoryForge Job ID stored in Cloudflare KV"
        required: true
        type: string
      test_background:
        description: "Use procedural test background (ONLY when backgrounds release is empty for smoke testing)"
        required: false
        default: "false"
        type: string

concurrency:
  group: storyforge-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          playwright install chromium

      - name: Run render pipeline
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          TEST_BACKGROUND: ${{ github.event.inputs.test_background }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/run_job.py

      - name: Preserve render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.event.inputs.job_id }}
          path: |
            /tmp/sf_render/**/*.mp4
            /tmp/sf_render/**/*.ass
            /tmp/sf_render/**/cards/*.png
          if-no-files-found: ignore
          retention-days: 3
