name: Render StoryForge Video
run-name: "Render StoryForge Video [${{ github.event.inputs.job_id }}]"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "StoryForge Job ID"
        required: true
        type: string
      voice_engine:
        description: "Voice engine (voicestudio or edge)"
        required: false
        default: ""
        type: string
      smoke_fixture:
        description: 'Optional repo fixture for CI smoke; uploads diagnostics only (no publishing)'
        type: choice
        default: 'none'
        options: [none, edge_single, edge_two_part, voicestudio_two_part, voicestudio_long]
      test_background:
        description: "Use procedural test background (ONLY when backgrounds release is empty for smoke testing)"
        required: false
        default: "false"
        type: string

concurrency:
  group: storyforge-render-${{ inputs.smoke_fixture || 'none' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select voice-engine dependencies
        id: engine
        env:
          JOB_ID: ${{ inputs.job_id }}
          INPUT_ENGINE: ${{ inputs.voice_engine }}
          FIXTURE: ${{ inputs.smoke_fixture }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
        run: |
          if [[ "$FIXTURE" == voicestudio_* ]]; then
            echo 'omni=true' >> "$GITHUB_OUTPUT"
          elif [[ "$FIXTURE" == edge_* ]]; then
            echo 'omni=false' >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_ENGINE" == "edge" ]]; then
            echo 'omni=false' >> "$GITHUB_OUTPUT"
          elif [[ "$INPUT_ENGINE" == "voicestudio" ]]; then
            echo 'omni=true' >> "$GITHUB_OUTPUT"
          else
            CONFIG=$(curl --fail --silent --show-error --max-time 20 -G --data-urlencode "id=$JOB_ID" -H "X-Internal-Secret: $WORKER_INTERNAL_SECRET" -A StoryForge-Runner "$WORKER_URL/api/internal/job")
            echo "omni=$(jq -r '(.voice_engine // "voicestudio") != "edge"' <<< "$CONFIG")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.engine.outputs.omni == 'true'
        with:
          path: ~/.cache/huggingface/hub
          key: storyforge-omni-3fc979d1-hub-v1

      - name: Install CPU-only OmniVoice
        if: steps.engine.outputs.omni == 'true'
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'omnivoice==0.2.1' 'transformers>=5.3,<6'

      - name: Ensure FFmpeg
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          ffmpeg -version | head -n 2
          ffmpeg -filters 2>/dev/null | grep -E " ass | overlay "

      - name: Install Python dependencies & Chromium
        timeout-minutes: 8
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          playwright install chromium

      - name: Run render pipeline
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          TEST_BACKGROUND: ${{ github.event.inputs.test_background }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIXTURE: ${{ inputs.smoke_fixture }}
          HF_HUB_DISABLE_XET: '1'
        run: |
          case "$FIXTURE" in
            edge_single) python pipeline/run_job.py --local-json schema/examples/single-video.json --engine edge --voice en-US-AndrewMultilingualNeural ;;
            edge_two_part) python pipeline/run_job.py --local-json schema/examples/smoke-two-part.json --engine edge --voice en-US-AndrewMultilingualNeural ;;
            voicestudio_two_part) python pipeline/run_job.py --local-json schema/examples/smoke-two-part.json --engine voicestudio --voice vs-harper ;;
            voicestudio_long) python pipeline/run_job.py --local-json schema/examples/two-part-series.json --engine voicestudio --voice vs-harper ;;
            none) python pipeline/run_job.py ;;
          esac

      - name: Preserve render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.event.inputs.job_id }}
          path: |
            /tmp/sf_render/**/*.mp4
            /tmp/sf_render/**/*.ass
            /tmp/sf_render/**/cards/*.png
          if-no-files-found: ignore
          retention-days: 3
