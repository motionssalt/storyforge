name: Verify Round 7 Stories & Full Render
on:
  workflow_dispatch: {}
jobs:
  last_channel_full_render:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: storyforge-omni-3fc979d1-hub-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: storyforge-omni-pip-v1
      - name: Install OmniVoice & dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'omnivoice==0.2.1' 'transformers>=5.3,<6'
          pip install -r pipeline/requirements.txt
          playwright install chromium
      - name: Run unit & fault-injection tests (all 9 tests)
        run: python pipeline/test_audio_checks.py
      - name: Render full two-part The Last Channel (vs-harper, VoiceStudio 1.25x)
        env:
          HF_HUB_DISABLE_XET: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python pipeline/run_job.py \
            --local-json schema/examples/round7-last-channel.json \
            --engine voicestudio \
            --voice vs-harper \
            --voicestudio-speedup 1.25 \
            --out-dir /tmp/sf_render_r7
      - name: Upload Round 7 rendered MP4s & subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round7-last-channel-render
          path: |
            /tmp/sf_render_r7/**/*.mp4
            /tmp/sf_render_r7/**/*.ass
            /tmp/sf_render_r7/**/cards/*.png
          if-no-files-found: ignore
          retention-days: 3

  room_between_floors_tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: storyforge-omni-3fc979d1-hub-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: storyforge-omni-pip-v1
      - name: Install OmniVoice & dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'omnivoice==0.2.1' 'transformers>=5.3,<6'
          pip install -r pipeline/requirements.txt
      - name: Synthesize & validate all lines of The Room Between Floors (vs-morgan, 1.25x)
        env:
          HF_HUB_DISABLE_XET: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python pipeline/verify_round7_stories.py \
            --json schema/examples/round7-room-between-floors.json \
            --voice vs-morgan \
            --speedup 1.25 \
            --out-dir /tmp/sf_tts_rbf
      - name: Upload Room Between Floors TTS summary & subtitles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round7-room-between-floors-tts
          path: |
            /tmp/sf_tts_rbf/**/*.ass
            /tmp/sf_tts_rbf/summary.json
          if-no-files-found: ignore
          retention-days: 3
