name: Generate StoryForge voice samples

on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "Optional sample text override"
        required: false
        default: ""
        type: string
      voicestudio_speedup:
        description: "Optional VoiceStudio speed-up override"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-voice-samples.yml'
      - 'pipeline/generate_voice_samples.py'
      - 'pipeline/voicestudio.py'
      - 'voices/voices.json'

permissions:
  contents: write

concurrency:
  group: storyforge-voice-samples
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: storyforge-omni-3fc979d1-hub-v1
      - run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'omnivoice==0.2.1' 'transformers>=5.3,<6' 'edge-tts>=7.0.0' 'faster-whisper>=1.0.3'
      - run: python pipeline/generate_voice_samples.py
        env:
          HF_HUB_DISABLE_XET: '1'
          SAMPLE_TEXT: ${{ github.event.inputs.sample_text }}
          VOICESTUDIO_SPEEDUP: ${{ github.event.inputs.voicestudio_speedup }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
      - name: Publish preview assets, then manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view voice-samples >/dev/null 2>&1 || gh release create voice-samples --title 'StoryForge voice samples' --notes 'Edge TTS and synthetic OmniVoice design previews (OmniVoice weights: CC BY-NC; no cloned voices).'
          # Remove stale whisper/legacy mp3 assets before uploading fresh set
          for name in $(gh release view voice-samples --json assets --jq '.assets[].name' | grep '\.mp3$' || true); do
            if [ ! -f "voice-sample-output/$name" ]; then
              gh release delete-asset voice-samples "$name" -y || true
            fi
          done
          gh release upload voice-samples voice-sample-output/*.mp3 --clobber
          gh release upload voice-samples voice-sample-output/voices.json --clobber
