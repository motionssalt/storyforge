name: StoryForge Voice Tool
run-name: "StoryForge Voice Tool [${{ github.event.inputs.mode }}: ${{ github.event.inputs.task_id }}]"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      mode:
        description: "Mode: design_preview or prepare_cloned"
        required: true
        type: string
      voice_id:
        description: "Cloned voice ID (for prepare_cloned)"
        required: false
        default: ""
        type: string
      instruct:
        description: "OmniVoice instruct string (for design_preview)"
        required: false
        default: ""
        type: string
      seed:
        description: "Seed integer (for design_preview)"
        required: false
        default: "1001"
        type: string
      preview_key:
        description: "Private KV preview key (for design_preview)"
        required: false
        default: ""
        type: string

concurrency:
  group: storyforge-voice-tool-${{ github.event.inputs.task_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: storyforge-omni-3fc979d1-hub-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: storyforge-omni-pip-v1
      - name: Install dependencies & FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'omnivoice==0.2.1' 'transformers>=5.3,<6' 'faster-whisper>=1.0.3' 'edge-tts>=7.0.0'
      - name: Run voice tool
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          VOICE_TOOL_MODE: ${{ github.event.inputs.mode }}
          VOICE_ID: ${{ github.event.inputs.voice_id }}
          INSTRUCT: ${{ github.event.inputs.instruct }}
          SEED: ${{ github.event.inputs.seed }}
          PREVIEW_KEY: ${{ github.event.inputs.preview_key }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
          HF_HUB_DISABLE_XET: '1'
        run: python pipeline/voice_tool.py
