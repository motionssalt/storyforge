name: StoryForge Background Library Import
run-name: "StoryForge Background Import [${{ github.event.inputs.task_id }}]"

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "StoryForge background import task ID"
        required: true
        type: string
      mode:
        description: "url | pending_asset | normalize_existing"
        required: true
        default: "url"
        type: string
      source_url:
        description: "Video URL or Google Drive share link (for mode=url)"
        required: false
        default: ""
        type: string
      pending_asset_name:
        description: "Staged release asset filename (for mode=pending_asset)"
        required: false
        default: ""
        type: string
      title:
        description: "Clip title"
        required: false
        default: ""
        type: string
      note:
        description: "Optional clip note / source description"
        required: false
        default: ""
        type: string
      attribution:
        description: "Optional attribution text"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  import-background:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fsSL -o /tmp/ffmpeg.tar.xz "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
            rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl
          fi
          ffmpeg -version | head -n 2

      - name: Import & normalize background clip
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
          IMPORT_MODE: ${{ github.event.inputs.mode }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          PENDING_ASSET_NAME: ${{ github.event.inputs.pending_asset_name }}
          CLIP_TITLE: ${{ github.event.inputs.title }}
          CLIP_NOTE: ${{ github.event.inputs.note }}
          CLIP_ATTRIBUTION: ${{ github.event.inputs.attribution }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_INTERNAL_SECRET: ${{ secrets.WORKER_INTERNAL_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pipeline/import_background.py
